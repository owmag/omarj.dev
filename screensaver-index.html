<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Screen Saver Ring</title>
    <style>
      :root {
        --bg: #000;
        --fg: #f3f3f3;
        --pad: clamp(3px, 0.7vmin, 8px);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: var(--bg);
        overflow: hidden;
      }

      body {
        display: grid;
        place-items: center;
      }

      .ring-wrap {
        width: 100vw;
        height: 100vh;
        padding: var(--pad);
      }

      .ring-svg {
        width: 100%;
        height: 100%;
        display: block;
      }

      .rotor {
        transform-origin: 50% 50%;
        animation: spin 160s linear infinite;
      }

      .ring-text {
        fill: var(--fg);
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 18px;
        text-transform: uppercase;
      }

      .ring-dot {
        font-size: 34px;
        baseline-shift: -0.16em;
      }

      @keyframes spin {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <main class="ring-wrap">
      <svg
        class="ring-svg"
        id="ringSvg"
        viewBox="0 0 1000 1000"
        xmlns="http://www.w3.org/2000/svg"
        xmlns:xlink="http://www.w3.org/1999/xlink"
        aria-label="Rotating text ring"
      >
        <defs>
          <path
            id="ringPath"
            d="M 500, 500 m -468, 0 a 468,468 0 1,1 936,0 a 468,468 0 1,1 -936,0"
          ></path>
        </defs>
        <g class="rotor">
          <text class="ring-text">
            <textPath href="#ringPath" xlink:href="#ringPath" startOffset="0">
              &#160;OMAR J &#160;&#160;<tspan class="ring-dot">●</tspan>&#8202;&#160;&#160;DESIGN ENGINEER &#160;&#160;<tspan class="ring-dot">●</tspan>&#8202;&#160;&#160;BUILDING PLAYFUL SYSTEMS IN MOTION &#160;&#160;<tspan class="ring-dot">●</tspan>&#8202;&#160;&#160;OMAR J &#160;&#160;<tspan class="ring-dot">●</tspan>&#8202;&#160;&#160;DESIGN ENGINEER &#160;&#160;<tspan class="ring-dot">●</tspan>&#8202;&#160;&#160;BUILDING PLAYFUL SYSTEMS IN MOTION &#160;&#160;<tspan class="ring-dot">●</tspan>&#8202;&#160;&#160;OMAR J &#160;&#160;<tspan class="ring-dot">●</tspan>&#8202;&#160;&#160;DESIGN ENGINEER &#160;&#160;<tspan class="ring-dot">●</tspan>&#8202;&#160;&#160;BUILDING PLAYFUL SYSTEMS IN MOTION &#160;&#160;<tspan class="ring-dot">●</tspan>&#8202;&#160;&#160;OMAR J &#160;&#160;<tspan class="ring-dot">●</tspan>&#8202;&#160;&#160;DESIGN ENGINEER &#160;&#160;<tspan class="ring-dot">●</tspan>&#8202;&#160;&#160;BUILDING PLAYFUL SYSTEMS IN MOTION &#160;&#160;<tspan class="ring-dot">●</tspan>&#8202;&#160;
            </textPath>
          </text>
        </g>
      </svg>
    </main>
  </body>
</html>
