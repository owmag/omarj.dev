  <body>
    <div id="appError" hidden></div>
    <main class="page" id="page">
      <div class="content-pane" id="panelWrap" aria-hidden="true">
        <div class="panel-wrap__grow">
          <article class="panel" id="panel" aria-live="polite">
            <div class="panel__banner" aria-hidden="true"></div>
            <div class="panel__body" id="panelBody"></div>
            <header class="panel__toolbar">
              <h2 class="panel__title" id="panelTitle"></h2>
              <p class="panel__actions">
                <button type="button" class="panel__link" id="panelSecondary" aria-label="Visit">[Visit]</button>
                <button type="button" class="panel__link" id="panelNext" hidden aria-label="Next">[Next]</button>
                <button type="button" class="panel__link" id="panelClose" aria-label="Close panel">[Close]</button>
              </p>
            </header>
          </article>
        </div>
      </div>

      <div class="title-layer" id="titleLayer">
      <div class="chips-viewport" id="chipsViewport">
        <div class="chips" id="chips">
        <button type="button" class="chip" data-key="listening" aria-pressed="false">
          <span class="chip__label">Listening</span>
        </button>
        <!-- Hidden for now — restore by uncommenting:
        <button type="button" class="chip" data-key="symposium" aria-pressed="false">
          <span class="chip__label">Language</span>
          <span class="chip__sublabel" aria-hidden="true">
            <span class="chip__lang-orb"></span>
            <span class="chip__sublabel-item">EN</span>
            <span class="chip__sublabel-item">AR</span>
            <span class="chip__sublabel-item">GR</span>
            <span class="chip__sublabel-item">SP</span>
            <span class="chip__sublabel-item">中</span>
          </span>
        </button>
        -->
        <button type="button" class="chip" data-key="label" aria-pressed="false">
          <span class="chip__label">Type</span>
        </button>
        <button type="button" class="chip chip--muted" data-key="text" aria-pressed="false">
          <span class="chip__label">Play</span>
        </button>
        <button type="button" class="chip" data-key="projects" aria-pressed="false">
          <span class="chip__label">Portfolio</span>
        </button>
        <button type="button" class="chip" data-key="bio" aria-pressed="false">
          <span class="chip__label">Bio</span>
        </button>
        <!-- Hidden for now — restore by uncommenting:
        <button type="button" class="chip" data-key="band" aria-pressed="false">
          <span class="chip__label">Band</span>
        </button>
        <button type="button" class="chip" data-key="radio" aria-pressed="false">
          <span class="chip__label">Radio</span>
        </button>
        -->
        <button type="button" class="chip chip--outline" data-key="contact" aria-pressed="false">
          <span class="chip__label">Contact</span>
        </button>
        <button type="button" class="chip" data-key="in-situ" aria-pressed="false">
          <span class="chip__label">Process</span>
        </button>
        </div>
      </div>
      </div>
    </main>
    <script type="module" src="./app.js"></script>
  </body>
