# Static site — no build step. Pretext is vendored under vendor/pretext/ (same-origin).
[build]
  command = "npm run build"
  publish = "."

# Client-side routes (e.g. /contact, /bio): serve index.html when no static file exists.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# --- Security headers (applied to every response) ---
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
    Cross-Origin-Opener-Policy = "same-origin"
    # CSP: no inline <script> anywhere (iOS orientation fix lives in app.js). The Projects
    # module injects its scoped CSS as a runtime <style> tag (projects-grid-portfolio.js) so
    # style-src-elem must allow 'unsafe-inline'; JS also sets element.style.* directly which
    # needs style-src-attr 'unsafe-inline'. Fonts come from gstatic + cargo.site.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; style-src-elem 'self' 'unsafe-inline' https://fonts.googleapis.com; style-src-attr 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com https://type.cargo.site; img-src 'self' data: blob:; media-src 'self' blob: https://stream.welcome.audio; connect-src 'self' https://stream.welcome.audio; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

# --- HTML: short TTL so updates roll out fast ---
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# --- JS modules: short cache, revalidated (no fingerprinting in place yet) ---
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

# --- Stylesheet: short cache, revalidated (no fingerprinting in place yet) ---
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

# --- Vendored Pretext (rarely changes) ---
[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# --- Media: long-lived, immutable (filename changes when content changes) ---
[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# --- Fonts / icons at root ---
[[headers]]
  for = "/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
